<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TensorFlow.js</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      #lossChart {
        width: 100%;
        max-width: 600px;
      }
    </style>
  </head>
  <body>
    <h1><strong>Predicción con TensorFlow.js</strong></h1>
    <p>Formula: y = 2x + 6</p>

    <button onclick="entrenarModelo()">Entrenar Modelo</button>
    <br /><br />

    <label>Valores de X (separados por comas):</label>
    <input type="text" id="inputX" placeholder="Ej: 10, 20, 25" />
    <button onclick="predecir()">Predecir</button>

    <p id="resultado">El modelo aún no está entrenado.</p>

    <canvas id="lossChart"></canvas>

    <script>
      let model;
      let lossValues = [];

      async function entrenarModelo() {
        document.getElementById("resultado").innerText = "Entrenando modelo...";

        model = tf.sequential();
        model.add(tf.layers.dense({ units: 1, inputShape: [1] }));
        model.compile({ loss: "meanSquaredError", optimizer: "sgd" });

        const xs = tf.tensor2d([-6, -5, -4, -3, -2, -1, 0, 1, 2], [9, 1]);
        const ys = tf.tensor2d(
          xs.dataSync().map((x) => 2 * x + 6),
          [9, 1]
        );

        lossValues = [];
        await model.fit(xs, ys, {
          epochs: 100,
          callbacks: {
            onEpochEnd: async (epoch, logs) => {
              lossValues.push({ epoch: epoch + 1, loss: logs.loss });
              if (epoch === 99) graficarPerdida();
            },
          },
        });

        document.getElementById("resultado").innerText =
          "Estado: Modelo entrenado correctamente.";
      }

      function predecir() {
        if (!model) {
          document.getElementById("resultado").innerText =
            "Primero debe entrenar el modelo.";
          return;
        }

        const inputText = document.getElementById("inputX").value;
        const inputs = inputText
          .split(",")
          .map((s) => parseFloat(s.trim()))
          .filter((v) => !isNaN(v));

        if (inputs.length === 0) {
          document.getElementById("resultado").innerText =
            "Ingrese uno o más números válidos.";
          return;
        }

        const tensorInput = tf.tensor2d(inputs, [inputs.length, 1]);
        const predictions = model.predict(tensorInput).dataSync();

        let resultHTML = "<strong>Resultados:</strong><ul>";
        inputs.forEach((x, i) => {
          resultHTML += `<li>Para x = ${x} → y ≈ ${predictions[i].toFixed(
            2
          )}</li>`;
        });
        resultHTML += "</ul>";
        document.getElementById("resultado").innerHTML = resultHTML;
      }

      function graficarPerdida() {
        const ctx = document.getElementById("lossChart").getContext("2d");
        new Chart(ctx, {
          type: "line",
          data: {
            labels: lossValues.map((p) => p.epoch),
            datasets: [
              {
                label: "Pérdida (Loss)",
                data: lossValues.map((p) => p.loss),
                borderColor: "teal",
                borderWidth: 2,
                fill: false,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: true },
              title: {
                display: true,
                text: "Gráfica de Pérdida durante el Entrenamiento",
              },
            },
            scales: {
              x: { title: { display: true, text: "Época" } },
              y: { title: { display: true, text: "Valor de Pérdida" } },
            },
          },
        });
      }
    </script>
  </body>
</html>
